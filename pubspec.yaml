name: aceite_medico_sirene
description: Plugin Android para tocar e parar a sirene do app Aceite Medico, com acionamento por OneSignal.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.aceitemedico.sirene
        pluginClass: AceiteMedicoSirenePlugin
